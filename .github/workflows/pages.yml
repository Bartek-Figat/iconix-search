# Unit tests and UI/UX tests run on every push and pull request; on main the demo site is published to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Test and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI/UX tests (headless Chrome)
        env:
          BROWSER: /usr/bin/google-chrome
          E2E_SHOTS: e2e/screenshots
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=tap e2e/site.e2e.mjs > e2e.tap
          code=$?
          tail -n 12 e2e.tap
          if [ $code -ne 0 ]; then
            # failures as annotations (readable on the run page and through the API)
            node scripts/ci-annotate.mjs e2e.tap
          fi
          exit $code
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site (page + library sources it loads)
        run: |
          mkdir _site
          cp -r index.html .nojekyll site src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
